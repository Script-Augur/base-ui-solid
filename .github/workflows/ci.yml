name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-script-augur
        with:
          cache: 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # Package exports point at dist/; build before lint/test so workspace
      # dependencies like @script-augur/base-ui-utils resolve.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test:run
