name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-script-augur
        with:
          cache: 'true'
        env:
          # Prefer NPM_TOKEN (PAT) so private @script-augur packages from
          # Script-Augur/packages can be installed; GITHUB_TOKEN cannot.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # Setup embeds the install token into ~/.npmrc. Rewrite with the job
      # token so changeset publish has packages:write on this repository.
      - name: Auth GitHub Packages for publish
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@script-augur:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}"
          } > "$HOME/.npmrc"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
