name: Setup Script-Augur
description: Setup Node, pnpm, and GitHub Packages auth for @script-augur installs
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
  pnpm-version:
    description: pnpm version
    required: false
    default: '9.9.0'
  cache:
    description: Enable setup-node pnpm cache (requires pnpm-lock.yaml)
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        registry-url: https://npm.pkg.github.com
        scope: '@script-augur'

    - name: Export package auth env
      shell: bash
      run: |
        TOKEN="${NPM_TOKEN:-${NODE_AUTH_TOKEN:-${GITHUB_TOKEN:-}}}"
        if [ -z "$TOKEN" ]; then
          echo "Warning: no NPM_TOKEN, NODE_AUTH_TOKEN, or GITHUB_TOKEN for GitHub Packages"
          exit 0
        fi
        echo "NPM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        # Ensure project .npmrc ${NPM_TOKEN} expands for this job
        mkdir -p "$HOME"
        {
          echo "@script-augur:registry=https://npm.pkg.github.com"
          echo "//npm.pkg.github.com/:_authToken=${TOKEN}"
        } >> "$HOME/.npmrc"
